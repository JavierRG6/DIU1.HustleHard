  <circle cx="20" cy="426" r="10" fill="#F8F4EF"/>
  <circle cx="370" cy="426" r="10" fill="#F8F4EF"/>

  <!-- Ticket content -->
  <text x="40" y="456" font-size="12" fill="#888">Producto</text>
  <text x="350" y="456" font-size="12" font-weight="bold" fill="#1A1A1A" text-anchor="end">Tomates Cherry eco</text>

  <text x="40" y="478" font-size="12" fill="#888">Cantidad</text>
  <text x="350" y="478" font-size="12" font-weight="bold" fill="#1A1A1A" text-anchor="end">2 kg</text>

  <text x="40" y="500" font-size="12" fill="#888">Productor</text>
  <text x="350" y="500" font-size="12" font-weight="bold" fill="#1A1A1A" text-anchor="end">Finca El Genil</text>

  <text x="40" y="522" font-size="12" fill="#888">Importe estimado</text>
  <text x="350" y="522" font-size="14" font-weight="bold" fill="#2E7D32" text-anchor="end">5,00 €</text>

  <!-- Ref code -->
