  <rect x="174" y="596" width="6" height="6" fill="#1A1A1A"/>
  <rect x="184" y="596" width="6" height="6" fill="#1A1A1A"/>
  <rect x="196" y="596" width="6" height="6" fill="#1A1A1A"/>
  <rect x="208" y="596" width="6" height="6" fill="#1A1A1A"/>
  <rect x="220" y="596" width="14" height="14" fill="#1A1A1A" rx="2"/>
  <rect x="156" y="614" width="6" height="6" fill="#1A1A1A"/>
  <rect x="220" y="614" width="6" height="6" fill="#1A1A1A"/>
  <rect x="170" y="614" width="16" height="8" fill="#1A1A1A"/>
  <rect x="196" y="614" width="16" height="8" fill="#1A1A1A"/>
  <rect x="156" y="666" width="14" height="14" fill="#1A1A1A" rx="2"/>
  <rect x="174" y="674" width="6" height="6" fill="#1A1A1A"/>
  <rect x="186" y="666" width="6" height="6" fill="#1A1A1A"/>
  <rect x="200" y="674" width="6" height="6" fill="#1A1A1A"/>
  <rect x="214" y="666" width="6" height="6" fill="#1A1A1A"/>
  <rect x="220" y="666" width="14" height="14" fill="#1A1A1A" rx="2"/>
  <text x="195" y="700" font-size="9" fill="#888" text-anchor="middle">Muestra este código el día del mercado</text>

  <!-- Actions -->
  <rect x="20" y="714" width="170" height="44" rx="8" fill="#2E7D32"/>
  <text x="105" y="741" font-size="13" font-weight="bold" fill="white" text-anchor="middle">Guardar ticket</text>

  <rect x="200" y="714" width="170" height="44" rx="8" fill="white" stroke="#2E7D32" stroke-width="1.5"/>
  <text x="285" y="741" font-size="13" fill="#2E7D32" text-anchor="middle">Compartir</text>

  <!-- Back to home -->
