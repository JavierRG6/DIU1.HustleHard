  <!-- BOTTOM NAV -->
  <rect y="796" width="390" height="48" fill="white" stroke="#E8E0D8" stroke-width="1"/>
  <text x="48" y="825" font-size="22" text-anchor="middle">🏠</text>
  <text x="48" y="840" font-size="9" fill="#888" text-anchor="middle">Inicio</text>
  <rect x="170" y="798" width="50" height="50" rx="25" fill="#F57F17"/>
  <text x="195" y="828" font-size="24" text-anchor="middle" fill="white">+</text>
  <text x="260" y="825" font-size="22" text-anchor="middle">📍</text>
  <text x="260" y="840" font-size="9" fill="#888" text-anchor="middle">Ediciones</text>
  <text x="342" y="825" font-size="22" text-anchor="middle">👤</text>
