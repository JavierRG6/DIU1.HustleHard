<svg viewBox="0 0 390 844" xmlns="http://www.w3.org/2000/svg" font-family="Arial, sans-serif">

  <rect width="390" height="844" fill="#F8F4EF"/>

  <!-- STATUS BAR -->
  <rect width="390" height="44" fill="#F8F4EF"/>
