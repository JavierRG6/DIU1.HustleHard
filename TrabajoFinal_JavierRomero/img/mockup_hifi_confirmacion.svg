  <text x="195" y="322" font-size="13" fill="#C8E6C9" text-anchor="middle">Recoge y paga el día del mercado</text>

  <!-- Ticket card -->
  <rect x="20" y="376" width="350" height="200" rx="14" fill="white" stroke="#E8E0D8" stroke-width="1"/>

  <!-- Ticket header -->
  <rect x="20" y="376" width="350" height="48" rx="14" fill="#E8F5E9"/>
  <rect x="20" y="406" width="350" height="18" fill="#E8F5E9"/>
  <text x="195" y="407" font-size="13" font-weight="bold" fill="#2E7D32" text-anchor="middle">EcoMercado UGR · 26 Jun 2026</text>

  <!-- Dashed separator -->
  <line x1="20" y1="426" x2="370" y2="426" stroke="#E0E0E0" stroke-width="1" stroke-dasharray="6 4"/>
