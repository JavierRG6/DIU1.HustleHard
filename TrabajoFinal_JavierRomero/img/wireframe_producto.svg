<svg viewBox="0 0 360 720" xmlns="http://www.w3.org/2000/svg" font-family="Arial, sans-serif">

  <!-- Phone frame -->
  <rect x="5" y="5" width="350" height="710" rx="28" fill="#1A1A1A"/>
  <rect x="12" y="18" width="336" height="684" rx="22" fill="white"/>

  <!-- Status bar -->
  <rect x="12" y="18" width="336" height="24" rx="22" fill="#F8F4EF"/>
  <rect x="12" y="30" width="336" height="12" fill="#F8F4EF"/>
  <text x="30" y="35" fill="#333" font-size="9">9:41</text>
  <rect x="290" y="24" width="45" height="12" rx="3" fill="#ccc"/>

  <!-- Header -->
  <rect x="12" y="42" width="336" height="44" fill="#2E7D32"/>
  <text x="42" y="69" fill="white" font-size="13">← Volver</text>
  <text x="310" y="69" fill="white" font-size="13" text-anchor="middle">🛒 2</text>

  <!-- Hero product image area -->
  <rect x="12" y="86" width="336" height="180" fill="#C8E6C9"/>
  <text x="180" y="185" text-anchor="middle" fill="#2E7D32" font-size="72">🍅</text>
  <!-- Certification badge -->
  <rect x="260" y="96" width="80" height="22" rx="11" fill="#2E7D32"/>
  <text x="300" y="111" text-anchor="middle" fill="white" font-size="9">✓ Cert. CAAE</text>

  <!-- Product info -->
  <text x="25" y="292" fill="#1A1A1A" font-size="16" font-weight="bold">Tomates Cherry ecológicos</text>
  <text x="25" y="312" fill="#2E7D32" font-size="12">📍 Finca El Genil · Órgiva, Granada</text>

  <!-- Stars -->
  <text x="25" y="330" fill="#F57F17" font-size="12">★★★★★</text>
  <text x="102" y="330" fill="#777" font-size="11"> 4.9 (23 valoraciones)</text>

  <line x1="25" y1="342" x2="335" y2="342" stroke="#E0E0E0" stroke-width="1"/>

  <!-- Price and availability -->
  <text x="25" y="363" fill="#1A1A1A" font-size="22" font-weight="bold">2,50 €</text>
  <text x="100" y="363" fill="#777" font-size="13"> / kg</text>
  <rect x="240" y="348" width="95" height="24" rx="12" fill="#E8F5E9" stroke="#2E7D32" stroke-width="1"/>
  <text x="287" y="364" text-anchor="middle" fill="#2E7D32" font-size="10">~18 kg disponibles</text>

  <text x="25" y="388" fill="#777" font-size="11">Para edición del <tspan fill="#2E7D32" font-weight="bold">26 Jun 2026</tspan></text>

  <line x1="25" y1="400" x2="335" y2="400" stroke="#E0E0E0" stroke-width="1"/>

  <!-- Quantity selector -->
  <text x="25" y="422" fill="#333" font-size="12" font-weight="bold">Cantidad:</text>
  <rect x="165" y="408" width="36" height="28" rx="4" fill="#F5F5F5" stroke="#E0E0E0"/>
  <text x="183" y="426" text-anchor="middle" fill="#333" font-size="16">−</text>
  <rect x="209" y="408" width="36" height="28" rx="4" fill="#2E7D32"/>
  <text x="227" y="426" text-anchor="middle" fill="white" font-size="14" font-weight="bold">1</text>
  <rect x="253" y="408" width="36" height="28" rx="4" fill="#F5F5F5" stroke="#E0E0E0"/>
  <text x="271" y="426" text-anchor="middle" fill="#333" font-size="16">+</text>
  <text x="297" y="426" fill="#777" font-size="11">  kg</text>

  <!-- CTA Button - 44px height minimum -->
  <rect x="18" y="448" width="316" height="48" rx="8" fill="#F57F17"/>
  <text x="180" y="477" text-anchor="middle" fill="white" font-size="14" font-weight="bold">PRE-RESERVAR — 2,50 €</text>

  <!-- Note about registration -->
  <text x="180" y="512" text-anchor="middle" fill="#999" font-size="9">Sin pago previo · Recoge y paga el día del mercado</text>

  <line x1="25" y1="524" x2="335" y2="524" stroke="#E0E0E0" stroke-width="1"/>

  <!-- About producer -->
  <text x="25" y="544" fill="#1A1A1A" font-size="13" font-weight="bold">Sobre el productor</text>
  <rect x="18" y="552" width="316" height="80" rx="6" fill="#F8F4EF"/>
  <text x="35" y="573" fill="#555" font-size="9">Finca El Genil lleva desde 2018 cultivando en la vega</text>
  <text x="35" y="586" fill="#555" font-size="9">granadina con métodos agroecológicos. Certificación</text>
  <text x="35" y="599" fill="#555" font-size="9">CAAE (Comité Andaluz de Agricultura Ecológica).</text>
  <text x="35" y="616" fill="#2E7D32" font-size="9" font-weight="bold">Ver todos los productos de este productor →</text>

  <!-- Related products -->
  <text x="25" y="650" fill="#1A1A1A" font-size="13" font-weight="bold">También disponible en esta edición</text>

  <!-- Home indicator -->
  <rect x="140" y="668" width="80" height="4" rx="2" fill="#1A1A1A"/>

  <!-- Label -->
  <text x="180" y="708" text-anchor="middle" fill="#999" font-size="10">Wireframe — Pantalla Detalle Producto (mobile)</text>

</svg>
